<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lofi Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Quicksand:wght@500;600;700&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="bar">
    <div class="theme-switch" role="group" aria-label="Lighting mode">
      <button type="button" data-theme-btn="light" aria-pressed="true">Light</button>
      <button type="button" data-theme-btn="night" aria-pressed="false">Night</button>
      <button type="button" data-theme-btn="dark" aria-pressed="false">Dark</button>
    </div>

    <div class="add-wrap">
      <button type="button" id="addBtn" class="add-btn" aria-expanded="false" aria-controls="addMenu">+ Add widget</button>
      <ul id="addMenu" class="add-menu" hidden></ul>
    </div>
  </header>

  <main id="desk" class="desk">
    <div id="items" class="items"></div>
    <div id="light" class="light" aria-hidden="true"></div>
  </main>

  <p class="hint">Drag anything to rearrange. Move the lamp to move the light.</p>

  <script src="script.js"></script>
</body>
</html>
